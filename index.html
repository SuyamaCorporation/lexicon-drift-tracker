<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexicon Drift Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 min-h-screen">
<div class="max-w-5xl mx-auto p-4">
  <header class="text-center py-6">
    <h1 class="text-3xl font-bold text-indigo-900">📖 Lexicon Drift Tracker</h1>
    <p class="text-indigo-700 mt-1">Track how word meanings shift across your writing corpus over time</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Add Entry Form -->
    <div class="lg:col-span-1 space-y-4">
      <div class="bg-white rounded-2xl shadow p-5 border border-indigo-200">
        <h2 class="font-semibold text-indigo-800 mb-3">Add Word Entry</h2>
        <div class="space-y-3">
          <div>
            <label class="text-xs font-medium text-gray-600">Word / Phrase</label>
            <input id="wordInput" type="text" placeholder="e.g. community" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Date of Use</label>
            <input id="dateInput" type="date" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Source / Work</label>
            <input id="sourceInput" type="text" placeholder="Essay, Blog Post, Journal..." class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Contextual Definition</label>
            <textarea id="definitionInput" rows="3" placeholder="How you used this word in this context..." class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Example Sentence</label>
            <textarea id="exampleInput" rows="2" placeholder="Paste a sentence using this word..." class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Semantic Tags (comma sep)</label>
            <input id="tagsInput" type="text" placeholder="social, political, personal" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Connotation</label>
            <select id="connotationInput" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <option value="positive">Positive</option>
              <option value="neutral">Neutral</option>
              <option value="negative">Negative</option>
              <option value="ambiguous">Ambiguous</option>
            </select>
          </div>
          <button onclick="addEntry()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg text-sm transition">+ Add Entry</button>
        </div>
      </div>

      <!-- Search -->
      <div class="bg-white rounded-2xl shadow p-4 border border-indigo-200">
        <label class="text-xs font-medium text-gray-600">Filter by word</label>
        <input id="searchInput" type="text" placeholder="Search words..." oninput="renderAll()" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>

    <!-- Main Content -->
    <div class="lg:col-span-2 space-y-5">
      <!-- Drift Summary -->
      <div class="bg-white rounded-2xl shadow p-5 border border-indigo-200">
        <h2 class="font-semibold text-indigo-800 mb-4">Semantic Drift Overview</h2>
        <div id="driftSummary" class="text-gray-400 text-sm italic">Add entries to see drift analysis</div>
      </div>

      <!-- Timeline per word -->
      <div id="wordTimelines" class="space-y-4"></div>
    </div>
  </div>
</div>

<script>
const CONNOTATION_COLORS = {
  positive: { bg: 'bg-green-100', text: 'text-green-800', dot: '#16a34a' },
  neutral:  { bg: 'bg-gray-100',  text: 'text-gray-800',  dot: '#6b7280' },
  negative: { bg: 'bg-red-100',   text: 'text-red-800',   dot: '#dc2626' },
  ambiguous:{ bg: 'bg-yellow-100',text: 'text-yellow-800',dot: '#d97706' }
};

const WORD_PALETTE = ['#6366f1','#8b5cf6','#ec4899','#06b6d4','#10b981','#f59e0b','#ef4444','#3b82f6','#84cc16','#f97316'];

let entries = JSON.parse(localStorage.getItem('lexicon_entries') || '[]');

function save() { localStorage.setItem('lexicon_entries', JSON.stringify(entries)); }

function addEntry() {
  const word = document.getElementById('wordInput').value.trim().toLowerCase();
  const date = document.getElementById('dateInput').value;
  const definition = document.getElementById('definitionInput').value.trim();

  if (!word || !date || !definition) {
    alert('Word, date, and definition are required');
    return;
  }

  const entry = {
    id: Date.now().toString(),
    word,
    date,
    source: document.getElementById('sourceInput').value.trim(),
    definition,
    example: document.getElementById('exampleInput').value.trim(),
    tags: document.getElementById('tagsInput').value.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean),
    connotation: document.getElementById('connotationInput').value
  };

  entries.push(entry);
  entries.sort((a,b) => a.date.localeCompare(b.date));
  save();
  renderAll();

  ['wordInput','sourceInput','definitionInput','exampleInput','tagsInput'].forEach(id => document.getElementById(id).value = '');
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save();
  renderAll();
}

function getUniqueWords() {
  const search = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
  const words = [...new Set(entries.map(e => e.word))];
  return search ? words.filter(w => w.includes(search)) : words;
}

function getWordColor(word, words) {
  const idx = words.indexOf(word) % WORD_PALETTE.length;
  return WORD_PALETTE[idx];
}

function renderDriftSummary(words) {
  const container = document.getElementById('driftSummary');
  if (entries.length === 0) {
    container.innerHTML = '<p class="text-gray-400 text-sm italic">Add entries to see drift analysis</p>';
    return;
  }

  const stats = words.map(word => {
    const wordEntries = entries.filter(e => e.word === word).sort((a,b) => a.date.localeCompare(b.date));
    const connotations = wordEntries.map(e => e.connotation);
    const uniqueConnotations = [...new Set(connotations)];
    const hasDrift = uniqueConnotations.length > 1;
    const allTags = [...new Set(wordEntries.flatMap(e => e.tags))];
    return { word, count: wordEntries.length, hasDrift, uniqueConnotations, allTags };
  });

  const drifted = stats.filter(s => s.hasDrift);
  const stable = stats.filter(s => !s.hasDrift);

  container.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <div class="bg-indigo-50 rounded-xl p-3 text-center">
        <p class="text-2xl font-bold text-indigo-700">${entries.length}</p>
        <p class="text-xs text-gray-500">Total Entries</p>
      </div>
      <div class="bg-purple-50 rounded-xl p-3 text-center">
        <p class="text-2xl font-bold text-purple-700">${words.length}</p>
        <p class="text-xs text-gray-500">Tracked Words</p>
      </div>
      <div class="bg-orange-50 rounded-xl p-3 text-center">
        <p class="text-2xl font-bold text-orange-700">${drifted.length}</p>
        <p class="text-xs text-gray-500">Shifted Meanings</p>
      </div>
      <div class="bg-green-50 rounded-xl p-3 text-center">
        <p class="text-2xl font-bold text-green-700">${stable.length}</p>
        <p class="text-xs text-gray-500">Stable Words</p>
      </div>
    </div>
    ${drifted.length > 0 ? `
    <div class="bg-orange-50 border border-orange-200 rounded-xl p-3">
      <p class="text-xs font-semibold text-orange-700 uppercase mb-2">Semantic Drift Detected</p>
      <div class="flex flex-wrap gap-2">
        ${drifted.map(s => `<span class="text-xs bg-orange-100 text-orange-800 px-2 py-1 rounded-full">
          <strong>${s.word}</strong> (${s.uniqueConnotations.join(' → ')})
        </span>`).join('')}
      </div>
    </div>` : ''}
  `;
}

function renderWordTimeline(word, wordEntries, color) {
  const sorted = [...wordEntries].sort((a,b) => a.date.localeCompare(b.date));
  const connotationShifts = sorted.map(e => e.connotation);
  const hasDrift = [...new Set(connotationShifts)].length > 1;

  // Draw timeline SVG
  const W = 400, H = 50;
  const n = sorted.length;
  const points = sorted.map((e, i) => ({
    x: n > 1 ? (i / (n-1)) * (W - 40) + 20 : W/2,
    y: H/2,
    e
  }));

  const lineStr = n > 1 ? `<polyline points="${points.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2" opacity="0.4"/>` : '';
  const dotStr = points.map(p => {
    const dc = CONNOTATION_COLORS[p.e.connotation]?.dot || '#6b7280';
    return `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${dc}" stroke="white" stroke-width="2">
      <title>${p.e.date}: ${p.e.connotation}</title>
    </circle>`;
  }).join('');

  const dateLabels = n > 0 ? `
    <text x="20" y="${H - 4}" font-size="8" fill="#9ca3af">${sorted[0].date}</text>
    ${n > 1 ? `<text x="${W - 20}" y="${H - 4}" text-anchor="end" font-size="8" fill="#9ca3af">${sorted[n-1].date}</text>` : ''}
  ` : '';

  return `
    <div class="bg-white rounded-2xl shadow border border-indigo-100 overflow-hidden">
      <div class="px-5 pt-4 pb-2 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full" style="background:${color}"></div>
          <h3 class="font-bold text-gray-800">"${word}"</h3>
          ${hasDrift ? '<span class="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">⚡ Drift</span>' : '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Stable</span>'}
          <span class="text-xs text-gray-400">${wordEntries.length} entr${wordEntries.length !== 1 ? 'ies' : 'y'}</span>
        </div>
      </div>
      <div class="px-4 pb-1">
        <svg viewBox="0 0 ${W} ${H}" class="w-full" height="${H}">${lineStr}${dotStr}${dateLabels}</svg>
      </div>
      <div class="px-5 pb-4 space-y-2 max-h-64 overflow-y-auto">
        ${sorted.map(e => {
          const cc = CONNOTATION_COLORS[e.connotation];
          return `<div class="border border-gray-100 rounded-xl p-3 bg-gray-50">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              <span class="text-xs font-semibold text-gray-600">${e.date}</span>
              ${e.source ? `<span class="text-xs text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">${e.source}</span>` : ''}
              <span class="text-xs ${cc.bg} ${cc.text} px-2 py-0.5 rounded-full">${e.connotation}</span>
              ${e.tags.map(t => `<span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">${t}</span>`).join('')}
              <button onclick="deleteEntry('${e.id}')" class="ml-auto text-gray-300 hover:text-red-400 text-xs">✕</button>
            </div>
            <p class="text-sm text-gray-700">${e.definition}</p>
            ${e.example ? `<p class="text-xs text-gray-500 mt-1 italic">"${e.example}"</p>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderAll() {
  const words = getUniqueWords();
  renderDriftSummary(words);

  const container = document.getElementById('wordTimelines');
  if (words.length === 0) {
    container.innerHTML = '<div class="text-center py-8 text-gray-400"><p class="text-3xl mb-2">📖</p><p>No entries yet. Start tracking word usage!</p></div>';
    return;
  }

  container.innerHTML = words.map(word => {
    const wordEntries = entries.filter(e => e.word === word);
    const color = getWordColor(word, words);
    return renderWordTimeline(word, wordEntries, color);
  }).join('');
}

document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
renderAll();
</script>
</body>
</html>
